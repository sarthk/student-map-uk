name: Deploy to GitHub Pages

# Publishes Students Map UK from web/: postcode place finder, optional game,
# and preserved legacy crime artifacts. The public place finder loads current
# OpenStreetMap data on request and needs no server-side application runtime.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install -r pipeline/requirements.txt
      - name: Run pipeline regressions
        run: python -m unittest discover -s pipeline/tests -v
      - name: Validate code and committed web data
        run: |
          python -m compileall -q pipeline serve.py
          python pipeline/validate_web_data.py
          node --check web/app.js
          node --check web/game.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
